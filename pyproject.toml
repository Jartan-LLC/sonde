[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonde"
dynamic = ["version"]
description = "Probe any HTTP API for its rate limits, burst ceiling, and full-scrape time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jartan LLC" }]
keywords = ["rate-limit", "http", "api", "scraping", "benchmark", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
# Every entry carries an upper bound. CI installs these fresh on every run, so
# an unbounded floor lets an upstream major redden `main` on its release day --
# which is what ruff 0.16.3 did on 2026-08-17 (PR #22). Sonde ships as a CLI
# tool rather than a library, so capping majors costs no downstream resolver
# room. Dependabot's minor-and-patch group proposes the bumps; a major stops at
# the ceiling and lands as a change someone reads.
dependencies = [
    "requests>=2.28,<3",
    "httpx>=0.24,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<10",
    "ruff>=0.16.3,<1",
]

[project.scripts]
sonde = "sonde.cli:main"

[project.urls]
Homepage = "https://github.com/Jartan-LLC/sonde"
Repository = "https://github.com/Jartan-LLC/sonde"
Issues = "https://github.com/Jartan-LLC/sonde/issues"
Changelog = "https://github.com/Jartan-LLC/sonde/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "sonde.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sonde = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

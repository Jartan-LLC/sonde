[build-system]
requires = ["hatchling>=1.32.4,<2"]
build-backend = "hatchling.build"

[project]
name = "sonde"
dynamic = ["version"]
description = "Probe any HTTP API for its rate limits, burst ceiling, and full-scrape time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jartan LLC" }]
keywords = ["rate-limit", "http", "api", "scraping", "benchmark", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
]
# Upper bounds stop at each dependency's next breaking release, so Dependabot
# proposes that bump as a PR rather than CI picking it up unannounced.
dependencies = [
    "requests>=2.28,<3",
    "httpx>=0.24,<1",
]

[project.optional-dependencies]
# ruff and codespell are versioned by their hook revs in .pre-commit-config.yaml.
dev = [
    "pytest>=7.0,<10",
]

[project.scripts]
sonde = "sonde.cli:main"

[project.urls]
Homepage = "https://github.com/Jartan-LLC/sonde"
Repository = "https://github.com/Jartan-LLC/sonde"
Issues = "https://github.com/Jartan-LLC/sonde/issues"
Changelog = "https://github.com/Jartan-LLC/sonde/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sonde/__init__.py"

# Hatchling ships the package's non-.py files (the py.typed PEP 561 marker)
# automatically.
[tool.hatch.build.targets.wheel]
packages = ["src/sonde"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.codespell]
# Skip generated, legal and vendored text.
skip = "./.git,./.venv,./node_modules,./dist,./build,./docs/_build,*.egg-info,*.lock,*-lock.json,LICENSE*"

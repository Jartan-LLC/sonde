name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

# uv installs and builds here too -- see ci.yml for why this is set once.
env:
  UV_SYSTEM_PYTHON: 1

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # Caching off, stated rather than left to the action's "auto" default:
      # this job publishes to PyPI through trusted publishing, so nothing a
      # cache another workflow wrote should be able to reach the artifact it
      # uploads. zizmor's cache-poisoning audit reads the explicit `false` and
      # not the default, so this is also what keeps the workflow lint green.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: ci/requirements.txt
          enable-cache: false

      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sonde/__init__.py)"
          if [ "$tag" != "$ver" ]; then
            echo "tag '$tag' does not match __version__ '$ver'"
            exit 1
          fi

      - run: uv pip install -r ci/requirements.txt

      - run: uv build

      - run: python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
